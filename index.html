      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MAXERIA</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#11100f;
    color:#eee9df;
    font-family:Arial, Helvetica, sans-serif;
}

#app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%, #292622 0%, #171513 38%, #0d0c0b 100%);
}

#app::before{
    content:"";
    position:absolute;
    inset:24px;
    border:1px solid rgba(218,190,142,.20);
    pointer-events:none;
    z-index:20;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:absolute;
    inset:0;
    padding:70px;
}

.home-inner{
    width:min(1200px,90%);
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:2;
}

/* =========================
   HOME VIDEO - BACKGROUND
========================= */

.home-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    z-index:0;
    background:#0b0a09;
    border:none;
}

.home-video video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
    opacity:.65;
}

/* =========================
   BRAND
========================= */

.brand-small{
    font-size:13px;
    letter-spacing:7px;
    color:#cbb184;
    margin-bottom:18px;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(65px,8vw,120px);
    letter-spacing:12px;
    font-weight:normal;
}

.tagline{
    margin-top:18px;
    font-size:13px;
    letter-spacing:5px;
    color:#938b80;
}

/* =========================
   CATEGORY
========================= */

.category-grid{
    width:100%;
    margin-top:70px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.category-card{
    height:245px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(218,190,142,.35);
    background:rgba(15,13,11,.18);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    transition:
        background .35s ease,
        border-color .35s ease,
        backdrop-filter .35s ease,
        transform .25s ease;
}

/* =========================
   TOUCH / ACTIVE MENU
========================= */

.home-inner.menu-active .category-card{
    background:rgba(15,13,11,.68);
    border-color:rgba(218,190,142,.55);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
}

.category-card:hover{
    transform:translateY(-5px);
    border-color:#cbb184;
}

.category-card:active{
    transform:scale(.98);
}

.category-card::before{
    content:"";
    position:absolute;
    left:22px;
    top:22px;
    width:35px;
    height:1px;
    background:#cbb184;
}

.category-number{
    position:absolute;
    top:32px;
    left:24px;
    font-family:Georgia,serif;
    font-size:15px;
    color:#bca47b;
}

.category-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.category-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:30px;
    letter-spacing:3px;
    font-weight:normal;
}

.category-sub{
    margin-top:12px;
    font-size:10px;
    letter-spacing:3px;
    color:#938b80;
}

/* =========================
   CATEGORY SCREEN
========================= */

.category-screen{
    justify-content:flex-start;
    padding-top:85px;
}

.topbar{
    width:min(1250px,90%);
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:55px;
}

.back-btn{
    border:1px solid rgba(218,190,142,.35);
    background:transparent;
    color:#ddd4c7;
    padding:14px 25px;
    font-size:11px;
    letter-spacing:3px;
    cursor:pointer;
}

.top-brand{
    font-family:Georgia,serif;
    letter-spacing:6px;
    font-size:22px;
}

.category-heading{
    width:min(1250px,90%);
    text-align:center;
    margin-bottom:45px;
}

.eyebrow{
    font-size:10px;
    letter-spacing:5px;
    color:#bda77f;
    margin-bottom:14px;
}

.category-heading h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(42px,5vw,70px);
    font-weight:normal;
    letter-spacing:4px;
}

.category-heading p{
    margin-top:13px;
    color:#8e877e;
    font-size:11px;
    letter-spacing:3px;
}

/* =========================
   PHOTO GRID - FIXED
========================= */

.product-grid{
    width:min(1250px,90%);
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:max-content;
    gap:18px;
    overflow-y:auto;
    padding-bottom:50px;
    align-items:start;
}

.product-card{
    width:100%;
    aspect-ratio:1 / 1;
    min-width:0;
    min-height:0;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(218,190,142,.22);
    background:#1b1917;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(.82) contrast(1.03);
    transition:.5s;
}

.product-card:hover .product-image{
    transform:scale(1.04);
    filter:saturate(1) contrast(1.05);
}

.product-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:18px;
    background:linear-gradient(
        transparent 35%,
        rgba(0,0,0,.25) 50%,
        rgba(0,0,0,.92) 100%
    );
}

.product-no{
    font-size:9px;
    letter-spacing:3px;
    color:#cbb184;
    margin-bottom:7px;
}

.product-name{
    font-family:Georgia,serif;
    font-size:19px;
}

.product-price{
    margin-top:7px;
    font-size:12px;
    letter-spacing:2px;
    color:#d0bb95;
}

/* =========================
   DETAIL
========================= */

.detail-screen{
    padding:70px;
}

.detail-wrapper{
    width:min(1250px,90%);
    height:80vh;
    display:grid;
    grid-template-columns:1.35fr .65fr;
    border:1px solid rgba(218,190,142,.22);
    background:#151311;
}

.detail-photo-area{
    position:relative;
    overflow:hidden;
    background:#0c0b0a;
}

.detail-photo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.photo-counter{
    position:absolute;
    top:25px;
    left:25px;
    padding:9px 14px;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.15);
    font-size:10px;
    letter-spacing:2px;
}

.photo-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border:1px solid rgba(255,255,255,.30);
    background:rgba(0,0,0,.55);
    color:white;
    font-size:25px;
    cursor:pointer;
}

.photo-arrow.left{
    left:20px;
}

.photo-arrow.right{
    right:20px;
}

.detail-info{
    padding:60px 45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-left:1px solid rgba(218,190,142,.16);
}

.detail-category{
    font-size:10px;
    letter-spacing:5px;
    color:#c2a77b;
    margin-bottom:20px;
}

.detail-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(35px,4vw,58px);
    font-weight:normal;
    line-height:1.1;
}

.detail-price{
    margin-top:25px;
    font-size:22px;
    letter-spacing:3px;
    color:#d0b98d;
}

.detail-description{
    max-width:430px;
    margin-top:28px;
    font-size:14px;
    line-height:1.8;
    color:#aaa198;
}

.detail-buttons{
    display:flex;
    gap:12px;
    margin-top:40px;
}

.detail-btn{
    min-width:145px;
    padding:16px 20px;
    background:transparent;
    color:#e7dfd3;
    border:1px solid rgba(218,190,142,.35);
    font-size:10px;
    letter-spacing:3px;
    cursor:pointer;
}

.detail-btn.primary{
    background:#c5aa7d;
    border-color:#c5aa7d;
    color:#161310;
}

/* =========================
   PORTRAIT
========================= */

@media (orientation:portrait){

    .screen{
        padding:60px 45px;
    }

    .category-grid{
        grid-template-columns:repeat(2,1fr);
        gap:16px;
        margin-top:50px;
    }

    .category-card{
        height:220px;
    }

    .category-title{
        font-size:25px;
    }

    .product-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-auto-rows:max-content;
    }

    .product-card{
        aspect-ratio:1 / 1;
    }

    .detail-wrapper{
        height:82vh;
        grid-template-columns:1fr;
        grid-template-rows:55% 45%;
    }

    .detail-info{
        border-left:none;
        border-top:1px solid rgba(218,190,142,.16);
        padding:25px;
    }

    .detail-description{
        margin-top:15px;
        line-height:1.5;
    }

    .detail-buttons{
        margin-top:20px;
    }
}

</style>

/* =========================================================
   STATE
========================================================= */

let currentCategory = null;
let currentProduct = 0;
let currentPhoto = 0;

const app = document.getElementById("app");


/* =========================================================
   HOME MENU VISIBILITY
========================================================= */

let menuVisibilityTimer;

function activateHomeMenu(){

    const homeInner = document.querySelector(".home-inner");

    if(!homeInner){
        return;
    }

    homeInner.classList.add("menu-active");

    clearTimeout(menuVisibilityTimer);

    menuVisibilityTimer = setTimeout(()=>{

        homeInner.classList.remove("menu-active");

    },5000);

}


/* =========================================================
   HOME
========================================================= */

function home(){

    currentCategory = null;

    clearTimeout(menuVisibilityTimer);

    app.innerHTML = `

        <section class="screen">

            <div class="home-video">

                <video autoplay muted loop playsinline preload="auto">
                    <source
                        src="resimler/tanitim-video.mp4"
                        type="video/mp4"
                    >
                </video>

            </div>

            <div
                class="home-inner"
                onclick="activateHomeMenu()"
            >

                <div class="brand-small">
                    HAIR • BEAUTY • BRAIDS
                </div>

                <div class="logo">
                    MAXERIA
                </div>

                <div class="tagline">
                    SELECT YOUR EXPERIENCE
                </div>

                <div class="category-grid">

                    ${categoryCard("01","BRAIDS","braids","BRAID COLLECTION")}

                    ${categoryCard("03","HAIR COLOR","hairColor","COLOR • BLONDE • BALAYAGE")}

function categoryCard(number,title,key,sub){

    return `

        <div
            class="category-card"
            onclick="showCategory('${key}')"
        >

            <div class="category-number">
                ${number}
            </div>

            <div class="category-content">

                <div class="category-title">
                    ${title}
                </div>

                <div class="category-sub">
                    ${sub}
                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   CATEGORY
   ALL PHOTOS ARE SHOWN AS SMALL SQUARES
========================================================= */

function showCategory(category){

    currentCategory = category;
    currentProduct = 0;
    currentPhoto = 0;

    const data = menu[category];

    let photoCards = "";
    let photoNumber = 1;

    data.products.forEach((product,productIndex)=>{

        product.photos.forEach((photo,photoIndex)=>{

            photoCards += `

                <div
                    class="product-card"
                    onclick="showProduct(${productIndex},${photoIndex})"
                >

                    <img
                        class="product-image"
                        src="${photo.src}"
                        onerror="this.style.display='none'"
                    >

                    <div class="product-overlay">

                        <div class="product-no">
                            ${String(photoNumber).padStart(2,"0")}
                        </div>

                        <div class="product-name">
                            ${photo.name}
                        </div>

                        <div class="product-price">
                            ${photo.price}
                        </div>

                    </div>

                </div>

            `;

            photoNumber++;

        });

    });


    app.innerHTML = `

        <section class="screen category-screen">

            <div class="topbar">

                <button
                    class="back-btn"
                    onclick="home()"
                >
                    ← MAIN MENU
                </button>

                <div class="top-brand">
                    MAXERIA
                </div>

                <div style="width:120px;"></div>

            </div>

            <div class="category-heading">

                <div class="eyebrow">
                    ${data.subtitle}
                </div>

                <h1>
                    ${data.title}
                </h1>

                <p>
                    SELECT YOUR STYLE
                </p>

            </div>

            <div class="product-grid">

                ${photoCards}

            </div>

        </section>

    `;
}


/* =========================================================
   PRODUCT
========================================================= */

function showProduct(productIndex,photoIndex=0){

    currentProduct = productIndex;
    currentPhoto = photoIndex;

    renderProduct();

}


/* =========================================================
   RENDER PRODUCT
========================================================= */

function renderProduct(){

    const category = menu[currentCategory];
    const product = category.products[currentProduct];
    const photo = product.photos[currentPhoto];

    app.innerHTML = `

        <section class="screen detail-screen">

            <div class="detail-wrapper">

                <div class="detail-photo-area">

                    <img
                        id="detailPhoto"
                        class="detail-photo"
                        src="${photo.src}"
                        onerror="this.style.opacity='0'"
                    >

                    <div class="photo-counter">
                        ${currentPhoto + 1} / ${product.photos.length}
                    </div>

                    ${
                        product.photos.length > 1
                        ?
                        `

                        <button
                            class="photo-arrow left"
                            onclick="previousPhoto()"
                        >
                            ‹
                        </button>

                        <button
                            class="photo-arrow right"
                            onclick="nextPhoto()"
                        >
                            ›
                        </button>

                        `
                        :
                        ""
                    }

                </div>

                <div class="detail-info">

                    <div class="detail-category">
                        ${category.title}
                    </div>

                    <div class="detail-name">
                        ${photo.name}
                    </div>

                    <div class="detail-price">
                        ${photo.price}
                    </div>

                    <div class="detail-description">
                        ${product.description}
                    </div>

                    <div class="detail-buttons">

                        <button
                            class="detail-btn"
                            onclick="backToCategory()"
                        >
                            ← BACK
                        </button>

                        <button
                            class="detail-btn primary"
                            onclick="home()"
                        >
                            MAIN MENU
                        </button>

                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =========================================================
   NEXT PHOTO
========================================================= */

function nextPhoto(){

    const photos =
        menu[currentCategory]
        .products[currentProduct]
        .photos;

    currentPhoto++;

    if(currentPhoto >= photos.length){
        currentPhoto = 0;
    }

    renderProduct();

}


/* =========================================================
   PREVIOUS PHOTO
========================================================= */

function previousPhoto(){

    const photos =
        menu[currentCategory]
        .products[currentProduct]
        .photos;

    currentPhoto--;

    if(currentPhoto < 0){
        currentPhoto = photos.length - 1;
    }

    renderProduct();

}


/* =========================================================
   BACK TO CATEGORY
========================================================= */

function backToCategory(){

    showCategory(currentCategory);

}


/* =========================================================
   30 SECOND INACTIVITY
========================================================= */

let inactivityTimer;

function resetInactivityTimer(){

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(()=>{

        home();

    },30000);

}


/* =========================================================
   USER ACTIVITY
========================================================= */

[
    "click",
    "touchstart",
    "pointerdown",
    "mousemove"
].forEach(event=>{

    document.addEventListener(
        event,
        (e)=>{

            resetInactivityTimer();

            if(
                document.querySelector(".home-inner") &&
                !e.target.closest(".category-card")
            ){

                activateHomeMenu();

            }

        },
        {passive:true}
    );

});


/* =========================================================
   START
========================================================= */

home();

resetInactivityTimer();

</script>

</body>
</html>
