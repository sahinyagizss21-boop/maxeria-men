<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080706;
    color:#f4eee5;
    font-family:Arial,Helvetica,sans-serif;
    overscroll-behavior:none;
}

button{
    font:inherit;
}

/* =====================================================
   GLOBAL BACKGROUND
===================================================== */

.global-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:#080706;
}

.global-bg-image{
    position:absolute;
    inset:-4%;
    background-image:url("resimler/maxeria-bg.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    transform:scale(1.04);
    animation:maxeriaCamera 24s ease-in-out infinite alternate;
    will-change:transform;
}

.global-bg-shade{
    position:absolute;
    inset:0;
    background:linear-gradient(
        180deg,
        rgba(0,0,0,.18) 0%,
        rgba(0,0,0,.08) 35%,
        rgba(0,0,0,.24) 100%
    );
    pointer-events:none;
}

.global-light{
    position:absolute;
    width:35%;
    height:160%;
    top:-30%;
    left:-50%;
    background:linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,220,165,0) 15%,
        rgba(255,220,165,.10) 50%,
        rgba(255,220,165,0) 85%,
        transparent 100%
    );
    transform:rotate(10deg);
    filter:blur(28px);
    animation:maxeriaLight 18s linear infinite;
    pointer-events:none;
}

.global-glow{
    position:absolute;
    left:-15%;
    right:-15%;
    bottom:-20%;
    height:50%;
    background:radial-gradient(
        ellipse at center,
        rgba(217,155,91,.10) 0%,
        rgba(170,105,62,.035) 40%,
        transparent 70%
    );
    filter:blur(30px);
    animation:maxeriaGlow 12s ease-in-out infinite alternate;
    pointer-events:none;
}

.global-petal{
    position:absolute;
    width:17px;
    height:11px;
    top:-10%;
    border-radius:75% 25% 70% 30%;
    background:radial-gradient(
        circle at 35% 30%,
        #f1b4bc 0%,
        #bd6875 55%,
        #713a43 100%
    );
    opacity:.55;
    animation:petalFall 20s linear infinite;
    pointer-events:none;
}

.global-petal.p1{
    left:7%;
    animation-delay:-4s;
    animation-duration:22s;
}

.global-petal.p2{
    left:24%;
    animation-delay:-14s;
    animation-duration:27s;
    width:13px;
    height:9px;
}

.global-petal.p3{
    left:63%;
    animation-delay:-9s;
    animation-duration:24s;
}

.global-petal.p4{
    left:86%;
    animation-delay:-18s;
    animation-duration:29s;
    width:14px;
    height:9px;
}

.global-petal.p5{
    left:46%;
    animation-delay:-22s;
    animation-duration:31s;
    width:11px;
    height:7px;
    opacity:.40;
}

.global-vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(
        ellipse at center,
        transparent 42%,
        rgba(0,0,0,.08) 68%,
        rgba(0,0,0,.40) 100%
    );
    pointer-events:none;
}

@keyframes maxeriaCamera{
    0%{
        transform:scale(1.04) translate3d(-.5%,0,0);
    }
    50%{
        transform:scale(1.075) translate3d(.6%,-.5%,0);
    }
    100%{
        transform:scale(1.055) translate3d(-.3%,.4%,0);
    }
}

@keyframes maxeriaLight{
    0%{
        left:-55%;
        opacity:0;
    }
    12%{
        opacity:.6;
    }
    75%{
        opacity:.35;
    }
    100%{
        left:125%;
        opacity:0;
    }
}

@keyframes maxeriaGlow{
    from{
        transform:translateX(-3%) scaleX(.96);
        opacity:.35;
    }
    to{
        transform:translateX(3%) scaleX(1.05);
        opacity:.75;
    }
}

@keyframes petalFall{
    0%{
        transform:translate3d(0,-12vh,0) rotate(0deg);
        opacity:0;
    }
    8%{
        opacity:.55;
    }
    30%{
        transform:translate3d(3vw,30vh,0) rotate(110deg);
    }
    55%{
        transform:translate3d(-2vw,58vh,0) rotate(210deg);
    }
    80%{
        transform:translate3d(4vw,85vh,0) rotate(310deg);
    }
    100%{
        transform:translate3d(-1vw,112vh,0) rotate(420deg);
        opacity:0;
    }
}

/* =====================================================
   SCREENS
===================================================== */

#app{
    width:100%;
    height:100%;
}

.screen{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
}

.scroll-area{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
    padding:70px 70px 90px;
}

.scroll-area::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
}

/* =====================================================
   HOME
===================================================== */

.home-screen{
    align-items:center;
    justify-content:center;
    padding:55px 60px;
}

.home-inner{
    width:min(1250px,94%);
    margin:auto;
    text-align:center;
}

.brand-small{
    color:#dabe8e;
    font-size:13px;
    letter-spacing:5px;
    margin-bottom:14px;
}

.logo{
    font-family:Georgia,serif;
    font-size:64px;
    letter-spacing:8px;
    color:#f5eee3;
}

.tagline{
    margin-top:13px;
    font-size:13px;
    letter-spacing:5px;
    color:rgba(255,255,255,.68);
}

.category-grid{
    margin-top:58px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}

.category-card,
.subcategory-card{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(218,190,142,.42);
    background:rgba(12,10,9,.48);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    box-shadow:0 10px 28px rgba(0,0,0,.18);
    transition:border-color .25s ease,transform .25s ease;
}

.category-card{
    height:245px;
}

.category-card:hover,
.subcategory-card:hover{
    border-color:rgba(218,190,142,.68);
}

.category-card:active,
.subcategory-card:active{
    transform:scale(.98);
}

.category-number,
.subcategory-number{
    position:absolute;
    left:22px;
    top:20px;
    color:rgba(218,190,142,.55);
    font-size:13px;
    letter-spacing:2px;
}

.category-content,
.subcategory-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:28px;
    text-align:left;
}

.category-title,
.subcategory-title{
    font-family:Georgia,serif;
    font-size:27px;
    color:#fff7eb;
}

.category-sub,
.subcategory-sub{
    margin-top:10px;
    color:#dabe8e;
    font-size:11px;
    letter-spacing:2px;
    line-height:1.5;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
    width:min(1250px,90%);
    margin:0 auto 55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.top-brand{
    font-family:Georgia,serif;
    font-size:24px;
    letter-spacing:5px;
}

.back-btn{
    min-width:120px;
    padding:12px 18px;
    color:#f4eee5;
    background:rgba(12,10,9,.45);
    border:1px solid rgba(218,190,142,.35);
    cursor:pointer;
}

.category-heading{
    width:min(1250px,90%);
    margin:0 auto 38px;
}

.eyebrow{
    color:#dabe8e;
    letter-spacing:4px;
    font-size:11px;
    margin-bottom:12px;
}

.category-heading h1{
    font-family:Georgia,serif;
    font-size:50px;
    font-weight:normal;
}

.category-heading p{
    margin-top:10px;
    color:rgba(255,255,255,.55);
    font-size:11px;
    letter-spacing:4px;
}

/* =====================================================
   SUBCATEGORY
===================================================== */

.subcategory-grid{
    width:min(1250px,90%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}

.subcategory-card{
    min-height:210px;
}

/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid{
    width:min(1250px,90%);
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:max-content;
    gap:18px;
    align-items:start;
}

.product-card{
    width:100%;
    aspect-ratio:1 / 1;
    min-width:0;
    min-height:0;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(218,190,142,.30);
    background:rgba(10,9,8,.58);
}

.product-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-overlay{
    position:absolute;
    inset:auto 0 0;
    min-height:42%;
    padding:50px 20px 20px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.86)
    );
}

.product-no{
    font-size:10px;
    color:#dabe8e;
    letter-spacing:2px;
}

.product-name{
    margin-top:6px;
    font-family:Georgia,serif;
    font-size:22px;
}

.product-price{
    margin-top:8px;
    color:#dabe8e;
    font-size:15px;
}

/* =====================================================
   DETAIL
===================================================== */

.detail-scroll{
    display:flex;
    align-items:center;
    justify-content:center;
}

.detail-wrapper{
    width:min(1250px,90%);
    min-height:80vh;
    display:grid;
    grid-template-columns:1.35fr .65fr;
    border:1px solid rgba(218,190,142,.25);
    background:rgba(14,12,10,.76);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    box-shadow:0 20px 55px rgba(0,0,0,.30);
}

.detail-photo-area{
    position:relative;
    overflow:hidden;
    background:rgba(7,6,5,.75);
}

.detail-photo{
    width:100%;
    height:100%;
    min-height:620px;
    object-fit:contain;
    display:block;
}

.photo-counter{
    position:absolute;
    right:18px;
    bottom:18px;
    padding:8px 12px;
    background:rgba(0,0,0,.65);
    font-size:12px;
}

.photo-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:70px;
    border:1px solid rgba(218,190,142,.35);
    background:rgba(0,0,0,.42);
    color:#fff;
    font-size:38px;
    cursor:pointer;
}

.photo-arrow.left{
    left:15px;
}

.photo-arrow.right{
    right:15px;
}

.detail-info{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:55px 40px;
    border-left:1px solid rgba(218,190,142,.16);
}

.detail-category{
    color:#dabe8e;
    font-size:11px;
    letter-spacing:3px;
}

.detail-name{
    margin-top:14px;
    font-family:Georgia,serif;
    font-size:40px;
    line-height:1.1;
}

.detail-price{
    margin-top:20px;
    color:#dabe8e;
    font-size:25px;
}

.detail-description{
    margin-top:25px;
    color:rgba(255,255,255,.70);
    font-size:15px;
    line-height:1.7;
}

.detail-buttons{
    display:flex;
    gap:10px;
    margin-top:35px;
}

.detail-btn{
    flex:1;
    padding:15px;
    border:1px solid rgba(218,190,142,.38);
    background:transparent;
    color:#fff;
    cursor:pointer;
}

.detail-btn.primary{
    background:#dabe8e;
    color:#17120d;
}

/* =====================================================
   PORTRAIT
===================================================== */

@media (orientation:portrait){

    .global-bg-image{
        inset:-3%;
        background-position:center center;
    }

    .home-screen{
        padding:60px 45px;
    }

    .scroll-area{
        padding:70px 45px 100px;
    }

    .logo{
        font-size:52px;
    }

    .category-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:16px;
        margin-top:50px;
    }

    .category-card{
        height:220px;
    }

    .category-title{
        font-size:25px;
    }

    .subcategory-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:16px;
    }

    .subcategory-card{
        min-height:210px;
    }

    .subcategory-title{
        font-size:25px;
    }

    .product-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-auto-rows:max-content;
    }

    .product-card{
        aspect-ratio:1 / 1;
    }

    .detail-wrapper{
        grid-template-columns:1fr;
        grid-template-rows:auto auto;
        min-height:auto;
    }

    .detail-photo{
        min-height:0;
        height:auto;
        max-height:58vh;
    }

    .detail-info{
        border-left:none;
        border-top:1px solid rgba(218,190,142,.16);
        padding:35px 25px;
    }

    .detail-description{
        margin-top:15px;
        line-height:1.5;
    }

    .detail-buttons{
        margin-top:20px;
    }
}

function categoryCard(number,title,key,sub){

    `;
}


/* =====================================================

===================================================== */

function showCategory(categoryKey){

    currentCategory = categoryKey;
    currentProduct = null;
    currentPhoto = 0;

    const category = menu[categoryKey];

    let cards = "";

    category.products.forEach((product,index)=>{

        cards += `

            <div class="subcategory-card"
                 onclick="showSubcategory(${index})">

                <div class="subcategory-number">

                    ${String(index + 1).padStart(2,"0")}

                </div>

                <div class="subcategory-content">

                    <div class="subcategory-title">
                        ${product.name}
                    </div>

                    <div class="subcategory-sub">

                        ${product.photos.length}
                        STYLE${product.photos.length > 1 ? "S" : ""}

                    </div>

                </div>

            </div>
        `;
    });

    app.innerHTML = `

        ${backgroundHTML()}

        <section class="screen">

            <div class="scroll-area">

                <div class="topbar">

                    <button class="back-btn"
                            onclick="home()">

                        ← MAIN MENU

                    </button>

                    <div class="top-brand">
                        MAXERIA
                    </div>

                    <div style="width:120px;"></div>

                </div>

                <div class="category-heading">

                    <div class="eyebrow">
                        ${category.subtitle}
                    </div>

                    <h1>
                        ${category.title}
                    </h1>

                    <p>
                        SELECT CATEGORY
                    </p>

                </div>

                <div class="subcategory-grid">
                    ${cards}
                </div>

            </div>

        </section>
    `;
}


/* =====================================================
   STANDARD SUBCATEGORY
===================================================== */

function showSubcategory(productIndex){

    currentProduct = productIndex;
    currentPhoto = 0;

    const category = menu[currentCategory];
    const product = category.products[productIndex];

    renderPhotoGrid(
        category.title,
        product.name,
        product.photos,
        `showDetail`,
        `showCategory('${currentCategory}')`
    );
}


/* =====================================================
   STANDARD DETAIL
===================================================== */

function showDetail(photoIndex){

    currentPhoto = photoIndex;

    const category = menu[currentCategory];
    const product = category.products[currentProduct];

    renderDetail(
        category.title,
        product.photos,
        currentPhoto,
        product.description,
        `showSubcategory(${currentProduct})`,
        "standard"
    );
}

/* =====================================================

===================================================== */

function renderPhotoGrid(

    title,
    photos,
    clickFunction,
    backFunction
){

    let cards = "";

    photos.forEach((photo,index)=>{

        cards += `

            <div class="product-card"
                 onclick="${clickFunction}(${index})">

                <img class="product-image"
                     src="${photo.src}"
                     onerror="this.style.display='none'">

                <div class="product-overlay">

                    <div class="product-no">

                        ${String(index + 1).padStart(2,"0")}

                    </div>

                    <div class="product-name">
                        ${photo.name}
                    </div>

                    ${
                        photo.price
                        ? `<div class="product-price">${photo.price}</div>`
                        : ""

                </div>

        `;
    });

    app.innerHTML = `

        ${backgroundHTML()}

                <div class="topbar">

                            onclick="${backFunction}">

                            onclick="home()">

                        MAIN MENU

                    </button>

                <div class="category-heading">

                    <div class="eyebrow">

                        ${title}

                        SELECT YOUR STYLE

    `;
}

    currentPhoto = photoIndex;

/* =====================================================
   COMMON DETAIL
===================================================== */

function renderDetail(
    categoryTitle,
    photos,
    photoIndex,
    description,
    backFunction,
    mode
){

    const photo =
        photos[photoIndex];

    app.innerHTML = `

        ${backgroundHTML()}

        <section class="screen">

            <div class="scroll-area detail-scroll">

                <div class="detail-wrapper">

                    <div class="detail-photo-area">

                        <img class="detail-photo"
                             src="${photo.src}"
                             onerror="this.style.opacity='0'">

                        <div class="photo-counter">

                            ${photoIndex + 1}
                            /
                            ${photos.length}

                        </div>

                        ${
                            photos.length > 1
                            ? `
                                <button class="photo-arrow left"
                                        onclick="previousCurrentPhoto('${mode}')">

                                    ‹

                                </button>

                                <button class="photo-arrow right"
                                        onclick="nextCurrentPhoto('${mode}')">

                                    ›

                                </button>
                              `
                            : ""
                        }

                    </div>

                    <div class="detail-info">

                        <div class="detail-category">
                            ${categoryTitle}
                        </div>

                        <div class="detail-name">
                            ${photo.name}
                        </div>

                        ${
                            photo.price
                            ? `
                                <div class="detail-price">
                                    ${photo.price}
                                </div>
                              `
                            : ""
                        }

                        <div class="detail-description">
                            ${description}
                        </div>

                        <div class="detail-buttons">

                            <button class="detail-btn"
                                    onclick="${backFunction}">

                                ← BACK

                            </button>

                            <button class="detail-btn primary"
                                    onclick="home()">

                                MAIN MENU

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>
    `;
}


/* =====================================================
   DETAIL PHOTO NAVIGATION
===================================================== */

function getCurrentPhotos(mode){

    if(mode === "standard"){

        return menu[currentCategory]
            .products[currentProduct]
            .photos;
    }

    if(mode === "hairColor"){

        return hairColor
            .sections[currentColorSection]
            .photos;
    }

    if(mode === "colorCollection"){

        return hairColor
            .sections[currentColorSection]
            .groups[currentColorGroup]
            .photos;
    }

    return [];
}


function nextCurrentPhoto(mode){

    const photos =
        getCurrentPhotos(mode);

    currentPhoto++;

    if(currentPhoto >= photos.length){
        currentPhoto = 0;
    }

    reopenDetail(mode);
}


function previousCurrentPhoto(mode){

    const photos =
        getCurrentPhotos(mode);

    currentPhoto--;

    if(currentPhoto < 0){
        currentPhoto = photos.length - 1;
    }

    reopenDetail(mode);
}


function reopenDetail(mode){

    if(mode === "standard"){

        showDetail(currentPhoto);

    }else if(mode === "hairColor"){

        showHairColorDetail(currentPhoto);

    }else if(mode === "colorCollection"){

        showColorDetail(currentPhoto);

    }
}


/* =====================================================
   30 SECOND INACTIVITY
===================================================== */

let inactivityTimer;

function resetInactivityTimer(){

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(()=>{

        home();

    },30000);
}


[
    "click",
    "touchstart",
    "pointerdown",
    "mousemove",
    "wheel",
    "scroll"
].forEach(event=>{

    document.addEventListener(
        event,
        resetInactivityTimer,
        {
            passive:true,
            capture:true
        }
    );

});


/* =====================================================
   START
===================================================== */

home();
resetInactivityTimer();

</script>
